[project]
name = "dexter"
version = "0.1.0"
description = "Dexter — a natural-language MBTA transit assistant (Phase 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "tzdata>=2024.1",
    # Instrumentation API only (no-op until the optional 'tracing' extra wires up
    # an SDK exporter). Keeps the app instrumentable with ~zero overhead when off.
    "opentelemetry-api>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "opentelemetry-sdk>=1.20",  # InMemorySpanExporter for tracing tests
]
# Tracing client (OpenInference / OpenTelemetry → Phoenix Cloud or a remote
# collector). Slim enough to ship in the deployed container: the OTLP exporter
# and instrumentations only, no Phoenix server. Install: `uv sync --extra tracing`.
tracing = [
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation-langchain>=0.1",
    "openinference-instrumentation-openai>=0.1",
]
# Local trace viewer (the full Phoenix server UI at localhost:6006). Heavy and
# only needed for local debugging: `uv sync --extra tracing-local`.
tracing-local = [
    "dexter[tracing]",
    "arize-phoenix>=4.0",
]
deploy = [
    "azure-core>=1.30",
    "azure-identity>=1.17",
    "azure-mgmt-appcontainers>=3.2",
    "azure-mgmt-authorization>=4.0",
    "azure-mgmt-containerregistry>=13.0",
    "azure-mgmt-resource>=23.1",
    "azure-mgmt-storage>=21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dexter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The router eval hits the live Azure OpenAI router, so it's deselected by default
# (the normal `pytest` loop stays fast/offline). Run it with `pytest -m eval`.
addopts = "-m 'not eval'"
markers = [
    "eval: opt-in router accuracy eval; calls the live Azure OpenAI router (run with `pytest -m eval`)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
