name: Deploy ACA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-aca-deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-dealsignal-prod
  CONTAINER_APP_NAME: dexter-beta
  CONTAINER_REGISTRY_NAME: dealsignalacr12345
  IMAGE_REPOSITORY: dexter
  DOCKERFILE_PATH: deploy/Dockerfile

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build deploy metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          image_tag="${GITHUB_SHA}"
          deployed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          revision_suffix="gha-${short_sha}"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "deployed_at=${deployed_at}" >> "$GITHUB_OUTPUT"
          echo "revision_suffix=${revision_suffix}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${CONTAINER_REGISTRY_NAME}.azurecr.io/${IMAGE_REPOSITORY}:${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        shell: bash
        run: az acr login --name "$CONTAINER_REGISTRY_NAME"

      - name: Build image
        shell: bash
        run: |
          docker build \
            -f "$DOCKERFILE_PATH" \
            -t "${{ steps.meta.outputs.image_ref }}" \
            .

      - name: Push image
        shell: bash
        run: docker push "${{ steps.meta.outputs.image_ref }}"

      - name: Stamp deploy timestamp secret
        shell: bash
        run: |
          az containerapp secret set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secrets "dexter-deployed-at=${{ steps.meta.outputs.deployed_at }}"

      - name: Update Container App revision
        shell: bash
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.meta.outputs.image_ref }}" \
            --revision-suffix "${{ steps.meta.outputs.revision_suffix }}" \
            --set-env-vars DEXTER_DEPLOYED_AT=secretref:dexter-deployed-at

      - name: Smoke test health endpoint
        shell: bash
        run: |
          app_url="$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          curl --fail --silent --show-error "https://${app_url}/health"
