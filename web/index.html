<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dexter — MBTA terminal (beta)</title>
<style>
  :root {
    --bg: #0b0f0b;
    --fg: #cfe8cf;
    --dim: #6f896f;
    --accent: #7fffd4;
    --you: #9ad1ff;
    --err: #ff8a7a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    display: flex;
    justify-content: center;
  }
  #screen {
    width: min(820px, 100%);
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 16px;
  }
  #titlebar {
    color: var(--dim);
    border-bottom: 1px solid #1d2a1d;
    padding-bottom: 8px;
    margin-bottom: 8px;
    user-select: none;
  }
  #titlebar b { color: var(--accent); }
  #log {
    flex: 1;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    scrollbar-width: thin;
    scrollbar-color: #2a3a2a transparent;
  }
  .line { margin: 2px 0; }
  .you  > .who { color: var(--you); }
  .dex  > .who { color: var(--accent); }
  .sys  { color: var(--dim); }
  .err  { color: var(--err); }
  .who  { user-select: none; }
  #inputline { display: flex; align-items: baseline; gap: 8px; padding-top: 6px; }
  #prompt { color: var(--you); user-select: none; }
  #entry {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font: inherit;
    caret-color: var(--accent);
  }
  #entry:disabled { opacity: 0.5; }
  .cursor { animation: blink 1.1s steps(1) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <div id="screen">
    <div id="titlebar"><b>dexter</b> — MBTA transit assistant · <span>prototype build</span></div>
    <div id="log" aria-live="polite"></div>
    <div id="inputline">
      <span id="prompt">you&gt;</span>
      <input id="entry" autocomplete="off" autocapitalize="off" autocorrect="off"
             spellcheck="false" aria-label="message" />
    </div>
  </div>

<script>
"use strict";

// --- dumb client: only talks to /chat. No transit logic lives here. ---
const log = document.getElementById("log");
const entry = document.getElementById("entry");

// Anonymous, per-tab session id so multi-turn follow-ups group correctly.
let sessionId = sessionStorage.getItem("dexter_sid");
if (!sessionId) {
  sessionId = (crypto.randomUUID && crypto.randomUUID()) ||
              String(Date.now()) + Math.random().toString(16).slice(2);
  sessionStorage.setItem("dexter_sid", sessionId);
}

let passcode = sessionStorage.getItem("dexter_pass") || null;
let awaitingPasscode = false;
let pendingMessage = null; // message to retry after a passcode is supplied
let busy = false;

function addLine(text, cls) {
  const div = document.createElement("div");
  div.className = "line " + (cls || "");
  if (cls === "you" || cls === "dex") {
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = cls === "you" ? "you> " : "dexter> ";
    div.appendChild(who);
    div.appendChild(document.createTextNode(text));
  } else {
    div.textContent = text;
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

// Typewriter reveal of dexter's reply — purely cosmetic, the full text already
// arrived from the server.
async function typeReply(text) {
  const div = addLine("", "dex");
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = "dexter> ";
  div.appendChild(who);
  const body = document.createTextNode("");
  div.appendChild(body);
  const step = text.length > 160 ? 3 : 1; // reveal long replies faster
  for (let i = 0; i < text.length; i += step) {
    body.textContent = text.slice(0, i + step);
    log.scrollTop = log.scrollHeight;
    await new Promise((r) => setTimeout(r, 9));
  }
  body.textContent = text;
}

async function sendChat(message) {
  const headers = { "Content-Type": "application/json" };
  if (passcode) headers["X-Dexter-Passcode"] = passcode;
  const res = await fetch("/chat", {
    method: "POST",
    headers,
    body: JSON.stringify({ session_id: sessionId, message }),
  });
  if (res.status === 401) {
    passcode = null;
    sessionStorage.removeItem("dexter_pass");
    throw new Error("unauthorized");
  }
  if (!res.ok) throw new Error("http " + res.status);
  return (await res.json()).reply || "";
}

function promptForPasscode() {
  awaitingPasscode = true;
  entry.type = "password";
  document.getElementById("prompt").textContent = "passcode>";
}

function clearPasscodePrompt() {
  awaitingPasscode = false;
  entry.type = "text";
  document.getElementById("prompt").textContent = "you>";
}

// Send a real user message; on 401, stash it and ask for the passcode so the
// gate only ever appears when the server actually requires it.
async function deliver(message, { echo }) {
  if (echo) addLine(message, "you");
  const thinking = addLine("…thinking", "sys");
  try {
    const reply = await sendChat(message);
    thinking.remove();
    await typeReply(reply);
  } catch (e) {
    thinking.remove();
    if (String(e.message) === "unauthorized") {
      pendingMessage = message;
      addLine("This beta is gated. Enter the passcode to continue.", "sys");
      promptForPasscode();
    } else {
      addLine("Couldn't reach Dexter. Try again in a moment.", "err");
    }
  }
}

async function handle(message) {
  if (awaitingPasscode) {
    passcode = message;
    sessionStorage.setItem("dexter_pass", passcode);
    clearPasscodePrompt();
    const retry = pendingMessage;
    pendingMessage = null;
    // Re-send the original message (not echoed again) now that we have a code.
    if (retry) await deliver(retry, { echo: false });
    return;
  }
  await deliver(message, { echo: true });
}

entry.addEventListener("keydown", async (ev) => {
  if (ev.key !== "Enter" || busy) return;
  const message = entry.value.trim();
  if (!message) return;
  entry.value = "";
  busy = true;
  entry.disabled = true;
  try {
    await handle(message);
  } finally {
    busy = false;
    entry.disabled = false;
    entry.focus();
  }
});

// Boot. No upfront passcode prompt — if the server is gated, the first message
// returns 401 and we ask then; if it isn't, the user is never bothered.
addLine("Dexter — ask about the next MBTA bus or train.", "sys");
addLine('e.g. "when\'s the next 1 bus to Harvard?"', "sys");
entry.focus();
</script>
</body>
</html>
